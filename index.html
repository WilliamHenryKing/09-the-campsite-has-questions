<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>THE CAMPSITE HAS QUESTIONS</title>
    <meta name="description" content="Solve physical-evidence mysteries in a humorous campground" />
    <style>
      /* Arrival veil: an incident book on a dusk-blue camp table, lifted by worldReady() in src/loader.ts. */
      #arrival { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 16px; background: radial-gradient(circle at 50% 40%, #4a5a6b, #2c2a33 70%); color: #2b2a33; font: 16px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; transition: opacity 0.6s ease, visibility 0.6s; }
      #arrival.is-done { opacity: 0; visibility: hidden; }
      #arrival .book { position: relative; width: min(320px, 100%); padding: 26px 24px 22px; border-radius: 6px; background: repeating-linear-gradient(to bottom, transparent 0 23px, #e2d5b8 23px 24px) 0 12px, #f7f0df; box-shadow: 0 16px 40px #0006; }
      #arrival .kicker { margin: 0 0 6px; font: 700 11px/1.3 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.14em; text-transform: uppercase; color: #c4473b; }
      #arrival .title { margin: 0 0 18px; font-size: 26px; font-weight: 800; line-height: 1.05; }
      #arrival .stamp { position: absolute; top: 16px; right: 14px; padding: 3px 7px; border: 3px double #3f7a57; color: #3f7a57; font: 800 11px/1.2 ui-monospace, Menlo, Consolas, monospace; text-transform: uppercase; transform: rotate(8deg); }
      #arrival .bar { height: 3px; background: #2b2a3322; overflow: hidden; border-radius: 2px; }
      #arrival .bar i { display: block; height: 100%; width: 40%; background: #2b2a33; animation: arrival-slide 1.2s ease-in-out infinite; }
      #arrival .note { margin: 10px 0 0; font: 12px/1.3 ui-monospace, Menlo, Consolas, monospace; color: #5d5866; }
      @keyframes arrival-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #arrival .bar i { animation: none; width: 100%; } #arrival { transition: none; } }
    </style>
  </head>
  <body>
    <div id="arrival" role="status" aria-live="polite"><div class="book"><p class="kicker">Campground incident book</p><p class="title">The Campsite Has Questions</p><span class="stamp">Open</span><div class="bar"><i></i></div><p class="note">Unpacking the evidence&hellip;</p></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
