<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="THE CAMPSITE HAS QUESTIONS: Inspect the evidence, hear the campers out, rebuild what happened.">
<title>THE CAMPSITE HAS QUESTIONS</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14251b"/><stop offset="1" stop-color="#2a4430"/></linearGradient>
<radialGradient id="glow" cx="0.78" cy="0.45" r="0.55"><stop offset="0" stop-color="#f0a04b" stop-opacity="0.42"/><stop offset="1" stop-color="#f0a04b" stop-opacity="0"/></radialGradient>
<linearGradient id="scan" x1="0" x2="1"><stop offset="0" stop-color="#f0a04b" stop-opacity="0"/><stop offset="0.5" stop-color="#f0a04b" stop-opacity="0.18"/><stop offset="1" stop-color="#f0a04b" stop-opacity="0"/></linearGradient>
</defs>
<style>
.t{font-family:Georgia, 'Times New Roman', serif;font-weight:700;fill:#f3ecd9;letter-spacing:-0.01em;animation:rise 1.1s ease-out both}
.e{font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-weight:700;font-size:17px;letter-spacing:0.28em;fill:#f0a04b;animation:rise 0.9s ease-out both}
.g{font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:24px;fill:#f3ecd9;opacity:0.82;animation:rise 1.3s ease-out 0.45s both}
.u{animation:grow 1.4s ease-out 0.6s both;transform-origin:72px 0}
.glow{animation:breathe 7s ease-in-out infinite;transform-origin:1000px 160px}
.p{animation:drift linear infinite}
.ring{transform-origin:1010px 180px;animation:spin linear infinite}
.wave{animation:slide linear infinite}
.scan{animation:sweep 6s linear infinite}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes breathe{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
@keyframes drift{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-190px);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slide{to{transform:translateX(-160px)}}
@keyframes sweep{to{transform:translateX(1520px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
